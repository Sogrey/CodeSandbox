<engine-type>mars3d</engine-type>
<title>高德地图图层</title>
<meta name="description" content="Mars3D 高德在线地图图层示例" />
<template>
  <div id="map3dContainer"></div>
</template>
<script>
  let map
  let gui
  let logger
  let currentLayer = null
  let creditDiv = null

  const creditHtml = '地图服务由高德提供-<span style="color:#fa0">审图号:GS(2025)5996号</span>-甲测资字11112528'

  const layerOptions = {
    layerType: 'vec',
    opacity: 1.0,
    brightness: 1.0,
    contrast: 1.0,
    hue: 0,
    saturation: 1.0,
    gamma: 1.0
  }

  const gaodeLayers = {
    vec: {
      name: '高德电子地图',
      type: 'gaode',
      layer: 'vec',
      icon: 'https://data.mars3d.cn/img/thumbnail/basemap/gaode_vec.png'
    },
    img: {
      name: '高德影像地图',
      type: 'group',
      layers: [
        { name: '底图', type: 'gaode', layer: 'img_d' },
        { name: '注记', type: 'gaode', layer: 'img_z' }
      ],
      icon: 'https://data.mars3d.cn/img/thumbnail/basemap/gaode_img.png'
    },
    time: {
      name: '高德实时路况',
      type: 'gaode',
      layer: 'time',
      icon: 'https://data.mars3d.cn/img/thumbnail/basemap/gaode_time.png'
    },
    vec_z: {
      name: '高德注记层',
      type: 'gaode',
      layer: 'vec_z',
      icon: 'https://data.mars3d.cn/img/thumbnail/basemap/gaode_vec.png'
    }
  }

  function createLogger() {
    const container = document.createElement('div')
    container.id = 'loggerContainer'
    container.style.position = 'fixed'
    container.style.bottom = '20px'
    container.style.right = '20px'
    container.style.width = '400px'
    container.style.maxHeight = '200px'
    container.style.backgroundColor = 'rgba(0, 0, 0, 0.85)'
    container.style.border = '1px solid #333'
    container.style.borderRadius = '6px'
    container.style.overflow = 'hidden'
    container.style.zIndex = '999'
    container.style.fontFamily = 'Consolas, Monaco, monospace'
    container.style.fontSize = '12px'
    container.style.color = '#0f0'

    const header = document.createElement('div')
    header.style.backgroundColor = '#222'
    header.style.padding = '8px 12px'
    header.style.borderBottom = '1px solid #333'
    header.innerHTML = '<span style="color: #888;">▶</span> 日志输出'
    container.appendChild(header)

    const content = document.createElement('div')
    content.id = 'loggerContent'
    content.style.padding = '8px 12px'
    content.style.height = 'calc(100% - 36px)'
    content.style.overflowY = 'auto'
    container.appendChild(content)

    document.body.appendChild(container)

    return {
      log: function(message, type = 'info') {
        const now = new Date()
        const time = now.toLocaleTimeString()
        const color = type === 'error' ? '#f44' : type === 'warn' ? '#fa0' : '#0f0'

        const line = document.createElement('div')
        line.style.marginBottom = '4px'
        line.style.color = color
        line.innerHTML = `<span style="color: #666;">[${time}]</span> ${message}`

        content.appendChild(line)
        content.scrollTop = content.scrollHeight
      }
    }
  }

  function createCreditBar() {
    const bar = document.createElement('div')
    bar.id = 'creditBar'
    bar.style.position = 'fixed'
    bar.style.bottom = '8px'
    bar.style.left = '10px'
    bar.style.backgroundColor = 'rgba(0, 0, 0, 0.7)'
    bar.style.padding = '4px 10px'
    bar.style.borderRadius = '4px'
    bar.style.fontSize = '10px'
    bar.style.color = '#888'
    bar.style.zIndex = '999'
    bar.style.fontFamily = 'Consolas, Monaco, monospace'
    bar.innerHTML = creditHtml
    document.body.appendChild(bar)
    creditDiv = bar
  }

  function createGUI() {
    const gui = new dat.GUI({ autoPlace: false })
    gui.domElement.id = 'guiContainer'
    gui.domElement.style.position = 'fixed'
    gui.domElement.style.top = '50px'
    gui.domElement.style.right = '20px'
    gui.domElement.style.zIndex = '999'
    document.body.appendChild(gui.domElement)

    const layerFolder = gui.addFolder('图层选择')
    const layerSelectOptions = [
      { value: 'vec', label: '高德电子地图' },
      { value: 'img', label: '高德影像地图' },
      { value: 'time', label: '高德实时路况' },
      { value: 'vec_z', label: '高德注记层' }
    ]

    const layerLabels = {}
    layerSelectOptions.forEach(function(opt) {
      layerLabels[opt.value] = opt.label
    })

    layerFolder.add(layerOptions, 'layerType', layerLabels).name('图层类型')
      .onChange(function(value) {
        switchLayer(value)
      })

    const styleFolder = gui.addFolder('图层样式')
    styleFolder.add(layerOptions, 'opacity', 0, 1).name('透明度')
      .onChange(function(value) {
        if (currentLayer) {
          currentLayer.opacity = value
        }
      })
    styleFolder.add(layerOptions, 'brightness', 0.5, 2).name('亮度')
      .onChange(function(value) {
        if (currentLayer && currentLayer.layer) {
          currentLayer.layer.brightness = value
        }
      })
    styleFolder.add(layerOptions, 'contrast', 0.5, 2).name('对比度')
      .onChange(function(value) {
        if (currentLayer && currentLayer.layer) {
          currentLayer.layer.contrast = value
        }
      })
    styleFolder.add(layerOptions, 'saturation', 0, 2).name('饱和度')
      .onChange(function(value) {
        if (currentLayer && currentLayer.layer) {
          currentLayer.layer.saturation = value
        }
      })

    layerFolder.open()

    return gui
  }

  function switchLayer(type) {
    if (!map) return

    if (currentLayer) {
      map.removeLayer(currentLayer, true)
      currentLayer = null
    }

    const layerConfig = gaodeLayers[type]
    if (!layerConfig) return

    let newLayer
    if (type === 'img') {
      newLayer = new mars3d.layer.GaodeLayer({
        name: layerConfig.name,
        type: 'group',
        layers: layerConfig.layers
      })
    } else {
      newLayer = new mars3d.layer.GaodeLayer({
        name: layerConfig.name,
        layer: layerConfig.layer
      })
    }

    currentLayer = newLayer
    map.addLayer(currentLayer)

    if (layerOptions.opacity !== 1) {
      currentLayer.opacity = layerOptions.opacity
    }

    logger.log('已切换到: ' + layerConfig.name)
    updateCreditInfo(layerConfig.name)
  }

  function updateCreditInfo(layerName) {
    if (creditDiv) {
      creditDiv.innerHTML = creditHtml + ' | 当前: ' + layerName
    }
  }

  function initMap() {
    map = new mars3d.Map('map3dContainer', {
      scene: {
        center: { lat: 34.265, lng: 108.954, alt: 50000, heading: 0, pitch: -79 }
      },
      control: {
        baseLayerPicker: false,
        homeButton: true,
        sceneModePicker: true,
        navigationHelpButton: true,
        fullscreenButton: true,
        contextmenu: { hasDefault: true },
      },
      basemaps: [
        {
          name: '天地图影像',
          icon: 'https://data.mars3d.cn/img/thumbnail/basemap/tdt_img.png',
          type: 'tdt',
          layer: 'img_d',
          show: true,
        },
      ],
      terrain: {
        url: 'https://data.mars3d.cn/terrain',
        show: true,
      },
    })

    createCreditBar()
    createGUI()
    logger = createLogger()

    logger.log('mars3d 地图初始化完成')
    logger.log('高德地图图层已就绪')

    switchLayer('vec')

    return map
  }

  initMap()
</script>
<style>
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: linear-gradient(270deg, #667eea 0%, #764ba2 100%);
    color: #333;
  }

  #map3dContainer {
    width: 100%;
    height: 100%;
  }
</style>

<engine-type>leaflet</engine-type>
<title>Leaflet 图层管理</title>
<meta name="description" content="Leaflet 图层管理控件示例，使用 L.control.layers 管理多个底图和叠加图层。" />
<template>
<div id="map"></div>

<div class="info-panel">
  <div>📂 使用右上角按钮切换图层</div>
  <div>当前底图: <span id="currentBase">矢量图</span></div>
</div>
</template>
<script>
  L.tileLayer.amap = function(option) {
    option = option || {};
    var layer;
    var subdomains = "1234";
    switch (option.layer) {
      case "vec":
        layer = L.tileLayer(
          "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
            name: option.name || "矢量图",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
      case "img_d":
        layer = L.tileLayer(
          "https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}", {
            name: option.name || "影像图",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
      case "img_z":
        layer = L.tileLayer(
          "https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}", {
            name: option.name || "影像注记",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
      case "img":
        layer = L.layerGroup([
          L.tileLayer.amap({ name: "影像底图", layer: "img_d" }),
          L.tileLayer.amap({ name: "影像注记", layer: "img_z" })
        ]);
        break;
      case "time":
        var time = new Date().getTime();
        layer = L.tileLayer(
          "https://tm.amap.com/trafficengine/mapabc/traffictile?v=1.0&t=1&x={x}&y={y}&z={z}&t=" + time, {
            name: option.name || "实时路况",
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
    }
    return layer;
  };

  var vec = L.tileLayer.amap({ layer: "vec", name: "矢量图" });
  var img_d = L.tileLayer.amap({ layer: "img_d", name: "影像图" });
  var img = L.tileLayer.amap({ layer: "img", name: "影像+注记" });
  var time = L.tileLayer.amap({ layer: "time", name: "实时路况" });

  var marker1 = L.marker([30.53, 114.3]).bindPopup('黄鹤楼');
  var marker2 = L.marker([30.54, 114.31]).bindPopup('武汉长江大桥');
  var marker3 = L.marker([30.52, 114.35]).bindPopup('武汉站');

  var poiLayer = L.layerGroup([marker1, marker2, marker3]);

  var circle = L.circle([30.535, 114.32], {
    color: '#3b82f6',
    fillColor: '#3b82f6',
    fillOpacity: 0.2,
    radius: 500
  }).bindPopup('圆形区域');

  var overlayLayers = {
    "POI标记": poiLayer,
    "圆形区域": circle
  };

  var map = L.map("map", {
    center: [30.53, 114.3],
    zoom: 13,
    layers: [vec],
    zoomControl: false
  });

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.control.layers({
    "矢量图": vec,
    "影像图": img_d,
    "影像+注记": img,
    "实时路况": time
  }, overlayLayers, {
    position: 'topright',
    collapsed: false
  }).addTo(map);

  map.on('baselayerchange', function(e) {
    document.getElementById('currentBase').innerText = e.name;
  });

  document.getElementById('currentBase').innerText = '矢量图';
</script>

<engine-type>leaflet</engine-type>
<title>Leaflet 地图操作示例</title>
<meta name="description" content="Leaflet.js 地图操作综合示例，包含地图背景设置、定位、显示级数设置和当前信息获取功能。" />
<template>
<div class="toolbar">
  <div class="tool-section">
    <h3>🗺️ 背景</h3>
    <select id="bgSelect" onchange="changeBackground()">
      <option value="none">无背景</option>
      <option value="grid">网格</option>
      <option value="gradient">渐变</option>
    </select>
  </div>

  <div class="tool-section">
    <h3>📍 定位</h3>
    <label>经度:</label>
    <input type="text" id="Xposition" value="114.3948" />
    <label>纬度:</label>
    <input type="text" id="Yposition" value="30.5217" />
    <button onclick="mapMove()" class="btn">平移</button>
    <button onclick="restore()" class="btn">复位</button>
  </div>

  <div class="tool-section">
    <h3>🔍 级数</h3>
    <label>级:</label>
    <input type="text" id="level" value="15" />
    <button onclick="zoomToLevel()" class="btn">设置</button>
    <button onclick="zoomIn()" class="btn">+</button>
    <button onclick="zoomOut()" class="btn">-</button>
  </div>

  <div class="tool-section">
    <h3>📊 信息</h3>
    <button onclick="getCurCenter()" class="btn">中心</button>
    <button onclick="getCurZoom()" class="btn">级数</button>
    <button onclick="getCurBound()" class="btn">范围</button>
    <button onclick="getMapDivInfo()" class="btn">视口</button>
    <div class="result-panel" id="resultPanel">
      <div id="resultContent">点击上方按钮查看信息</div>
    </div>
  </div>
</div>

<div id="map"></div>

<div class="info-panel">
  <div>中心: <span id="infoCenter">-</span></div>
  <div>级数: <span id="infoZoom">-</span></div>
  <div>范围: <span id="infoBounds">-</span></div>
</div>
</template>
<script>
  L.tileLayer.amap = function(option) {
    option = option || {};
    var layer;
    var subdomains = "1234";
    switch (option.layer) {
      case "vec":
      default:
        layer = L.tileLayer(
          "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
            name: option.name || "矢量图",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
    }
    return layer;
  };

  var map;
  var vecLayer = L.tileLayer.amap({ layer: "vec", name: "矢量图" });

  function init() {
    map = L.map('map', {
      crs: L.CRS.EPSG3857,
      center: [30.5217, 114.3948],
      minZoom: 1,
      maxZoom: 18,
      zoom: 15,
      layers: [vecLayer],
      maxBounds: L.latLngBounds(L.latLng(-90, -180), L.latLng(90, 180))
    });

    map.on('moveend zoomend', updateInfo);
    updateInfo();
  }

  init();

  function changeBackground() {
    var bg = document.getElementById('bgSelect').value;
    var mapContainer = document.getElementById('map');
    
    switch(bg) {
      case 'grid':
        mapContainer.style.backgroundImage = 'linear-gradient(rgba(0,0,0,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.1) 1px, transparent 1px)';
        mapContainer.style.backgroundSize = '50px 50px';
        break;
      case 'gradient':
        mapContainer.style.backgroundImage = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
        mapContainer.style.backgroundSize = 'cover';
        break;
      default:
        mapContainer.style.backgroundImage = 'none';
    }
  }

  function mapMove() {
    var X = document.getElementById("Xposition").value;
    var Y = document.getElementById("Yposition").value;
    
    if (X != "" && Y != "") {
      if (!isNaN(X) && !isNaN(Y)) {
        var pntX = parseFloat(X);
        var pntY = parseFloat(Y);
        
        if (pntY >= -90 && pntY <= 90 && pntX >= -180 && pntX <= 180) {
          var coordinate = [pntY, pntX];
          map.setView(coordinate, map.getZoom());
        } else {
          alert('请输入有效的经纬度！\n纬度: -90~90\n经度: -180~180');
        }
      } else {
        alert('请输入数字！');
      }
    } else {
      alert('请输入内容！');
    }
  }

  function restore() {
    map.setView([30.5217, 114.3948], 15);
  }

  function zoomToLevel() {
    var zoomLevel = document.getElementById("level").value;
    
    if (zoomLevel % 1 == 0 && zoomLevel >= 0) {
      if (zoomLevel <= 18) {
        map.setView(map.getCenter(), parseInt(zoomLevel));
      } else {
        alert("最大显示级数为18！");
      }
    } else {
      alert("请输入非负整数！");
    }
  }

  function zoomIn() {
    map.zoomIn();
  }

  function zoomOut() {
    map.zoomOut();
  }

  function getCurCenter() {
    var center = map.getCenter();
    document.getElementById('resultContent').innerHTML = 
      '<strong>当前中心</strong><br/>' +
      '纬度: ' + center.lat.toFixed(6) + '<br/>' +
      '经度: ' + center.lng.toFixed(6);
  }

  function getCurZoom() {
    var zoom = map.getZoom();
    document.getElementById('resultContent').innerHTML = 
      '<strong>当前级数</strong><br/>' +
      zoom + ' 级';
  }

  function getCurBound() {
    var ex = map.getBounds();
    var ymin = ex._southWest.lat.toFixed(6);
    var xmin = ex._southWest.lng.toFixed(6);
    var ymax = ex._northEast.lat.toFixed(6);
    var xmax = ex._northEast.lng.toFixed(6);
    document.getElementById('resultContent').innerHTML = 
      '<strong>地图范围</strong><br/>' +
      '纬度: ' + ymin + ' ~ ' + ymax + '<br/>' +
      '经度: ' + xmin + ' ~ ' + xmax;
  }

  function getMapDivInfo() {
    var mapSize = map.getSize();
    document.getElementById('resultContent').innerHTML = 
      '<strong>视口大小</strong><br/>' +
      '宽度: ' + mapSize.x + ' px<br/>' +
      '高度: ' + mapSize.y + ' px';
  }

  function updateInfo() {
    var center = map.getCenter();
    document.getElementById('infoCenter').textContent = 
      center.lat.toFixed(4) + ', ' + center.lng.toFixed(4);
    document.getElementById('infoZoom').textContent = map.getZoom() + '级';
    
    var bounds = map.getBounds();
    document.getElementById('infoBounds').textContent = 
      bounds.getSouthWest().lat.toFixed(4) + ',' + bounds.getSouthWest().lng.toFixed(4) + 
      ' ~ ' + 
      bounds.getNorthEast().lat.toFixed(4) + ',' + bounds.getNorthEast().lng.toFixed(4);
  }

  window.onload = init;
</script>

<engine-type>leaflet</engine-type>
<title>Leaflet 加载 WMTS 服务</title>
<meta name="description" content="在WebGIS开发中，WMTS（Web Map Tile Service）作为OGC（开放地理空间联盟）的核心标准之一，被广泛应用于地理空间数据的瓦片化服务。与动态渲染的WMS不同，WMTS通过预生成的瓦片提供高性能的地图服务。" />
<template>
<div id="map"></div>

<div class="info-panel" id="infoPanel">
  🔄 正在加载地图和WMTS图层...
</div>
</template>
<script type="module">
  // ========== 1. 初始化地图（禁用双击缩放） ==========
  // 地图视野设定为美国区域（影像数据覆盖范围）
  const map = L.map('map', {
    doubleClickZoom: false // 禁用双击缩放
  }).setView([39.8283, -98.5795], 4);

  // 高德矢量底图
  L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
    subdomains: ['1', '2', '3', '4'],
    attribution: '&copy; 高德地图'
  }).addTo(map);

  // 比例尺控件
  L.control.scale({
    metric: true,
    imperial: false,
    position: 'bottomleft'
  }).addTo(map);
  map.zoomControl.setPosition('bottomright');

  // ========== 2. 添加 WMTS 图层 ==========
  const infoDiv = document.getElementById('infoPanel');

  // 使用您提供的 WMTS 服务地址模板
  const baseUrl = 'https://wayback.maptiles.arcgis.com/arcgis/rest/services/world_imagery/wmts/1.0.0/default028mm/mapserver';
  const tileMatrixSetId = '32645'; // 根据您的瓦片地址推断的参数
  const wmtsUrl = `${baseUrl}/tile/${tileMatrixSetId}/{z}/{y}/{x}`;

  const wmtsLayer = L.tileLayer(wmtsUrl, {
    maxZoom: 18,
    minZoom: 1,
    opacity: 0.85,
    attribution: '&copy; <a href="https://www.arcgis.com">ArcGIS WMTS 影像服务</a>'
  }).addTo(map);

  // ========== 3. 添加显示/隐藏按钮 ==========
  let isLayerVisible = true;

  const customControl = L.Control.extend({
    options: {
      position: 'topright'
    },
    onAdd: function() {
      const container = L.DomUtil.create('div', 'leaflet-bar');
      const button = L.DomUtil.create('button', 'custom-control-btn', container);
      button.innerHTML = '🗺️ 隐藏WMTS图层';

      button.onclick = function() {
        if (isLayerVisible) {
          map.removeLayer(wmtsLayer);
          button.innerHTML = '🗺️ 显示WMTS图层';
          button.classList.add('btn-hidden');
          infoDiv.innerHTML = `🗺️ WMTS图层已隐藏<br>点击右上角按钮可重新显示`;
          infoDiv.style.borderLeftColor = '#ffaa44';
        } else {
          map.addLayer(wmtsLayer);
          button.innerHTML = '🗺️ 隐藏WMTS图层';
          button.classList.remove('btn-hidden');
          infoDiv.innerHTML = `✅ WMTS图层已显示<br>🗺️ ArcGIS 影像服务 (透明度85%)`;
          infoDiv.classList.add('success-panel');
        }
        isLayerVisible = !isLayerVisible;
      };

      return container;
    }
  });

  map.addControl(new customControl());

  // ========== 4. 监听图层加载状态 ==========
  wmtsLayer.on('load', function() {
    infoDiv.innerHTML = `
                    ✅ WMTS 图层加载成功！<br>
                    📡 服务: ArcGIS World Imagery (影像图)<br>
                    🗺️ 内容: 全球高分辨率卫星影像<br>
                    🎨 透明度: 85% (与底图叠加)<br>
                    🖱️ 点击右上角按钮可切换显示/隐藏<br>
                    🔒 双击缩放已禁用
                `;
    infoDiv.classList.add('success-panel');
    console.log('WMTS 影像图层加载完成');
  });

  // 瓦片加载错误处理
  wmtsLayer.on('tileerror', function(e) {
    console.warn('WMTS 瓦片加载失败:', e);
    infoDiv.innerHTML = `
                    ⚠️ WMTS 瓦片加载异常<br>
                    服务: ArcGIS World Imagery<br>
                    可能原因: 网络延迟或服务参数<br>
                    💡 尝试: 按F12查看控制台具体错误
                `;
    infoDiv.style.borderLeftColor = '#ffaa44';
  });

  console.log('地图初始化完成，双击缩放已禁用');
</script>

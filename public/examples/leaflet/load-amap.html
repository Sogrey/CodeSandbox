<engine-type>leaflet</engine-type>
<title>Leaflet 加载高德地图</title>
<meta name="description" content="在 Web GIS 开发中，Leaflet 因其轻量、易用、可扩展性强而备受青睐。而高德地图作为国内主流的地图服务商，提供了丰富的瓦片服务。本文将详细介绍如何使用 Leaflet 加载高德地图的多种图层，并实现一个功能完整、界面美观的地图应用。" />
<template>
<div id="map"></div>

<!-- 右上角按钮组 -->
<div class="map-control-panel" id="layerPanel">
  <button data-layer="vec" class="ctrl-btn active">🗺️ 矢量图</button>
  <button data-layer="img" class="ctrl-btn">🛰️ 影像(含注记)</button>
  <button data-layer="img_d" class="ctrl-btn">📸 纯影像</button>
  <button data-layer="img_z" class="ctrl-btn">📝 影像注记</button>
  <button data-layer="time" class="ctrl-btn">🚦 实时路况</button>
</div>

<!-- 左下角坐标卡片 -->
<div class="coord-card" id="location">📍 点击地图获取坐标</div>

<!-- 动态信息面板 -->
<div class="info-panel" id="promptInfo">
  💡 当前图层: <span id="currentLayer">矢量图</span><br>
  🌐 服务地址: <span id="serviceUrl">高德矢量瓦片</span>
</div>
</template>
<script>
  // ========== 高德图层扩展 ==========
  L.tileLayer.amap = function(option) {
    option = option || {};
    var layer;
    var subdomains = "1234";
    switch (option.layer) {
      case "vec":
      default:
        layer = L.tileLayer(
          "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
            name: option.name || "矢量图",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
      case "img_d":
        layer = L.tileLayer(
          "https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}", {
            name: option.name || "影像图",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
      case "img_z":
        layer = L.tileLayer(
          "https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}", {
            name: option.name || "影像注记",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
      case "img":
        layer = L.layerGroup([
          L.tileLayer.amap({
            name: "影像底图",
            layer: "img_d"
          }),
          L.tileLayer.amap({
            name: "影像注记",
            layer: "img_z"
          })
        ]);
        break;
      case "time":
        var time = new Date().getTime();
        layer = L.tileLayer(
          "https://tm.amap.com/trafficengine/mapabc/traffictile?v=1.0&t=1&x={x}&y={y}&z={z}&t=" + time, {
            name: option.name || "实时路况",
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
    }
    return layer;
  };

  // 创建图层实例
  let vec = new L.tileLayer.amap({
    layer: "vec",
    name: "矢量图"
  });
  let img_d = new L.tileLayer.amap({
    layer: "img_d",
    name: "影像图"
  });
  let img_z = new L.tileLayer.amap({
    layer: "img_z",
    name: "影像注记"
  });
  let img = new L.tileLayer.amap({
    layer: "img",
    name: "影像图(含注记)"
  });
  let time = new L.tileLayer.amap({
    layer: "time",
    name: "实时路况"
  });

  // ========== 初始化地图 ==========
  var options = {
    center: [31.2397, 121.5016],
    zoom: 15,
    layers: [vec],
    zoomControl: false
  };
  var map = L.map("map", options);

  // 添加缩放控件到右下角
  L.control.zoom({
    position: 'bottomright'
  }).addTo(map);

  // 添加标记点
  L.marker([31.2397, 121.5016])
    .addTo(map)
    .bindTooltip("上海东方明珠广播电视塔")
    .openTooltip();

  // 图层映射
  const baseLayers = {
    矢量图: vec,
    影像图: img_d,
    影像注记: img_z,
    "影像图(含注记)": img,
    实时路况: time
  };

  // 获取图层信息
  function getLayerInfo(layerName, layerObj) {
    let urlStr = "";
    if (layerObj && layerObj._url) {
      urlStr = layerObj._url;
    } else if (layerObj && layerObj._layers) {
      let urls = [];
      for (let k in layerObj._layers) {
        if (layerObj._layers[k]._url) {
          urls.push(layerObj._layers[k]._url);
        }
      }
      urlStr = urls.join(" + ");
    } else {
      urlStr = "高德地图服务";
    }
    return {
      name: layerName,
      url: urlStr
    };
  }

  // 更新UI
  function updateUI(activeLayerName, activeLayerObj) {
    // 更新按钮高亮
    const buttons = document.querySelectorAll('.ctrl-btn');
    buttons.forEach(btn => {
      if (btn.innerText.includes(activeLayerName) ||
        (activeLayerName === "矢量图" && btn.dataset.layer === "vec") ||
        (activeLayerName === "影像图" && btn.dataset.layer === "img_d") ||
        (activeLayerName === "影像注记" && btn.dataset.layer === "img_z") ||
        (activeLayerName === "影像图(含注记)" && btn.dataset.layer === "img") ||
        (activeLayerName === "实时路况" && btn.dataset.layer === "time")) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    // 更新信息面板
    const info = getLayerInfo(activeLayerName, activeLayerObj);
    document.getElementById('currentLayer').innerText = info.name;
    let displayUrl = info.url;
    if (displayUrl && displayUrl.length > 80) {
      displayUrl = displayUrl.substring(0, 80) + "...";
    }
    document.getElementById('serviceUrl').innerText = displayUrl || "高德地图服务";
  }

  // 切换图层
  function switchToLayer(layerKey, layerName, layerObj) {
    // 移除所有图层
    for (let key in baseLayers) {
      if (map.hasLayer(baseLayers[key])) {
        map.removeLayer(baseLayers[key]);
      }
    }
    // 添加新图层
    map.addLayer(layerObj);
    updateUI(layerName, layerObj);

    // 实时路况刷新
    if (layerKey === "time") {
      let newTimeLayer = new L.tileLayer.amap({
        layer: "time",
        name: "实时路况"
      });
      baseLayers["实时路况"] = newTimeLayer;
      time = newTimeLayer;
      map.removeLayer(layerObj);
      map.addLayer(newTimeLayer);
      updateUI("实时路况", newTimeLayer);
    }
  }

  // 绑定按钮事件
  const btnMap = {
    'vec': {
      layer: vec,
      name: '矢量图',
      key: '矢量图'
    },
    'img': {
      layer: img,
      name: '影像图(含注记)',
      key: '影像图(含注记)'
    },
    'img_d': {
      layer: img_d,
      name: '影像图',
      key: '影像图'
    },
    'img_z': {
      layer: img_z,
      name: '影像注记',
      key: '影像注记'
    },
    'time': {
      layer: time,
      name: '实时路况',
      key: 'time'
    }
  };

  const buttons = document.querySelectorAll('.ctrl-btn');
  buttons.forEach(btn => {
    btn.addEventListener('click', function() {
      const layerType = this.dataset.layer;
      if (layerType && btnMap[layerType]) {
        const target = btnMap[layerType];
        switchToLayer(target.key, target.name, target.layer);
      }
    });
  });

  // 初始化
  updateUI("矢量图", vec);

  // ========== 鼠标点击显示坐标（原生JS） ==========
  let lastClickCoords = null;
  const locationCard = document.getElementById('location');

  map.on("click", (e) => {
    let lng = e.latlng.lng.toFixed(6);
    let lat = e.latlng.lat.toFixed(6);
    let lnglat = `📍 经度: ${lng}  | 纬度: ${lat}`;
    locationCard.innerHTML = lnglat;
    lastClickCoords = `${lng}, ${lat}`;
  });

  // 点击坐标卡片复制坐标
  locationCard.addEventListener("click", function() {
    if (lastClickCoords) {
      navigator.clipboard.writeText(lastClickCoords).then(() => {
        const original = this.innerHTML;
        this.innerHTML = "📋 坐标已复制！";
        setTimeout(() => {
          this.innerHTML = original;
        }, 1500);
      }).catch(() => {
        this.innerHTML = "⚠️ 复制失败";
        setTimeout(() => {
          this.innerHTML = "📍 点击地图获取坐标";
        }, 1000);
      });
    } else {
      this.innerHTML = "🗺️ 请先点击地图";
      setTimeout(() => {
        this.innerHTML = "📍 点击地图获取坐标";
      }, 1200);
    }
  });

  // 自适应
  window.addEventListener('resize', () => {
    map.invalidateSize();
  });
</script>

<engine-type>leaflet</engine-type>
<title>Leaflet加载GPX轨迹数据</title>
<meta name="description" content="在户外运动、车辆监控、路径规划等WebGIS场景中，GPX（GPS Exchange Format）作为标准的GPS数据交换格式被广泛使用。" />
<template>
<div id="map"></div>

<div class="info-panel" id="infoPanel">🔄 正在加载GPX轨迹数据...</div>
</template>
<script type="module">
 // ========== 1. 初始化地图 ==========
 const map = L.map('map').setView([42.45, -71.11], 13);

 // 使用 OpenStreetMap 底图
 L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
   maxZoom: 19,
   attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
 }).addTo(map);

 L.control.scale({
   metric: true,
   imperial: false,
   position: 'bottomleft'
 }).addTo(map);
 map.zoomControl.setPosition('bottomright');

 // ========== 2. 加载 GPX 轨迹 ==========
 const infoDiv = document.getElementById('infoPanel');
 // 直接使用您指定的地址
 const gpxUrl = '../../../CodeSandbox/datas/demo.gpx';

 infoDiv.innerHTML = `⏳ 正在加载GPX轨迹...<br>📁 ${gpxUrl}`;

 const gpxLayer = new L.GPX(gpxUrl, {
   async: true,
   polyline_options: {
     color: '#ff3366',
     weight: 4,
     opacity: 0.9
   },
   // 标记点样式（起点、终点）
   marker_options: {
     startIconUrl: 'https://cdn.jsdelivr.net/npm/leaflet-gpx@1.4.0/pin-icon-start.png',
     endIconUrl: 'https://cdn.jsdelivr.net/npm/leaflet-gpx@1.4.0/pin-icon-end.png',
     shadowUrl: 'https://cdn.jsdelivr.net/npm/leaflet-gpx@1.4.0/pin-shadow.png'
   },
   waypoint: true, // 显示途经点
   gpx_options: {
     parseElements: ['track', 'route', 'waypoint']
   }
 });

 gpxLayer.on('loaded', function(e) {
   const gpx = e.target;
   map.fitBounds(gpx.getBounds());

   const name = gpx.get_name();
   const distance = (gpx.get_distance() / 1000).toFixed(2);
   const startTime = gpx.get_start_time();
   const movingTime = gpx.get_duration_string(gpx.get_moving_time());
   const avgSpeed = (gpx.get_moving_speed() * 3.6).toFixed(1);

   infoDiv.innerHTML = `
                    ✅ GPX 轨迹加载成功！<br>
                    📊 名称: ${name}<br>
                    📏 距离: ${distance} km<br>
                    ⏱️ 移动时间: ${movingTime}<br>
                    🏃 平均速度: ${avgSpeed} km/h<br>
                    📅 开始时间: ${startTime ? startTime.toLocaleString() : '未知'}<br>
                    🖱️ 已自动定位至轨迹范围
                `;
   console.log('GPX 加载完成', gpx);
 });

 gpxLayer.on('error', function(e) {
   console.error('GPX 加载失败:', e);
   infoDiv.innerHTML = `❌ GPX 加载失败<br>📁 ${gpxUrl}<br>💡 该地址可能不可访问，请检查网络或更换地址`;
 });

 gpxLayer.addTo(map);
</script>

<engine-type>leaflet</engine-type>
<title>Leaflet 地图导航</title>
<meta name="description" content="Leaflet 地图导航控件示例，使用 Leaflet.NavBar 插件实现导航箭头快速定位。" />
<template>
<div id="map"></div>

<div class="navbar-panel" id="navbarPanel">
  <button id="btnHome" class="nav-btn nav-btn-home" title="回到起点">🏠</button>
  <div class="nav-cross">
    <button id="btnUp" class="nav-btn nav-btn-arrow" title="向上移动">▲</button>
    <div class="nav-horizontal">
      <button id="btnLeft" class="nav-btn nav-btn-arrow" title="向左移动">◀</button>
      <button id="btnCenter" class="nav-btn nav-btn-center" title="当前位置">◎</button>
      <button id="btnRight" class="nav-btn nav-btn-arrow" title="向右移动">▶</button>
    </div>
    <button id="btnDown" class="nav-btn nav-btn-arrow" title="向下移动">▼</button>
  </div>
</div>

<div class="info-panel">
  <div>🧭 使用导航按钮快速定位</div>
  <div>🔍 当前级别: <span id="zoomLevel">12</span></div>
</div>
</template>
<script>
  L.tileLayer.amap = function(option) {
    option = option || {};
    var layer;
    var subdomains = "1234";
    switch (option.layer) {
      case "vec":
      default:
        layer = L.tileLayer(
          "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
            name: option.name || "矢量图",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
    }
    return layer;
  };

  var vec = L.tileLayer.amap({ layer: "vec", name: "矢量图" });

  var map = L.map("map", {
    center: [30.53, 114.3],
    zoom: 12,
    layers: [vec],
    zoomControl: false
  });

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  document.getElementById('btnHome').addEventListener('click', function() {
    map.setView([30.53, 114.3], 12);
  });

  document.getElementById('btnLeft').addEventListener('click', function() {
    var center = map.getCenter();
    map.setView([center.lat, center.lng - 0.01]);
  });

  document.getElementById('btnRight').addEventListener('click', function() {
    var center = map.getCenter();
    map.setView([center.lat, center.lng + 0.01]);
  });

  document.getElementById('btnUp').addEventListener('click', function() {
    var center = map.getCenter();
    map.setView([center.lat + 0.01, center.lng]);
  });

  document.getElementById('btnDown').addEventListener('click', function() {
    var center = map.getCenter();
    map.setView([center.lat - 0.01, center.lng]);
  });

  document.getElementById('btnCenter').addEventListener('click', function() {
    map.setView([30.53, 114.3], map.getZoom());
  });

  map.on('zoomend', function() {
    document.getElementById('zoomLevel').innerText = map.getZoom();
  });

  document.getElementById('zoomLevel').innerText = map.getZoom();
</script>

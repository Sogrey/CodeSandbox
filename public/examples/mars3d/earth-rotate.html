<engine-type>mars3d</engine-type>
<title>旋转的地球</title>
<meta name="description" content="Mars3D 旋转地球动画示例" />
<template>
  <div id="map3dContainer"></div>
</template>
<script>
  let map
  let gui
  let logger
  let rotateOptions = {
    enabled: true,
    speed: 1.0,
    direction: 'cw',
    autoStart: true
  }

  let previousTime = null
  let isRotating = false

  function createLogger() {
    const container = document.createElement('div')
    container.id = 'loggerContainer'
    container.style.position = 'fixed'
    container.style.bottom = '20px'
    container.style.right = '20px'
    container.style.width = '400px'
    container.style.maxHeight = '200px'
    container.style.backgroundColor = 'rgba(0, 0, 0, 0.85)'
    container.style.border = '1px solid #333'
    container.style.borderRadius = '6px'
    container.style.overflow = 'hidden'
    container.style.zIndex = '999'
    container.style.fontFamily = 'Consolas, Monaco, monospace'
    container.style.fontSize = '12px'
    container.style.color = '#0f0'

    const header = document.createElement('div')
    header.style.backgroundColor = '#222'
    header.style.padding = '8px 12px'
    header.style.borderBottom = '1px solid #333'
    header.innerHTML = '<span style="color: #888;">▶</span> 日志输出'
    container.appendChild(header)

    const content = document.createElement('div')
    content.id = 'loggerContent'
    content.style.padding = '8px 12px'
    content.style.height = 'calc(100% - 36px)'
    content.style.overflowY = 'auto'
    container.appendChild(content)

    document.body.appendChild(container)

    return {
      log: function(message, type = 'info') {
        const now = new Date()
        const time = now.toLocaleTimeString()
        const color = type === 'error' ? '#f44' : type === 'warn' ? '#fa0' : '#0f0'

        const line = document.createElement('div')
        line.style.marginBottom = '4px'
        line.style.color = color
        line.innerHTML = `<span style="color: #666;">[${time}]</span> ${message}`

        content.appendChild(line)
        content.scrollTop = content.scrollHeight
      }
    }
  }

  function createGUI() {
    const gui = new dat.GUI({ autoPlace: false })
    gui.domElement.id = 'guiContainer'
    gui.domElement.style.position = 'fixed'
    gui.domElement.style.top = '50px'
    gui.domElement.style.right = '20px'
    gui.domElement.style.zIndex = '999'
    document.body.appendChild(gui.domElement)

    const settingsFolder = gui.addFolder('旋转设置')
    settingsFolder.add(rotateOptions, 'enabled').name('启用旋转')
    settingsFolder.add(rotateOptions, 'speed', 0.1, 10).name('旋转速度')
    settingsFolder.add(rotateOptions, 'direction', ['cw', 'ccw']).name('旋转方向')
      .onChange(function(value) {
        logger.log(`旋转方向: ${value === 'cw' ? '顺时针' : '逆时针'}`)
      })

    const actionsFolder = gui.addFolder('操作')
    actionsFolder.add({ start: function() { startRotate() } }, 'start').name('开始旋转')
    actionsFolder.add({ stop: function() { stopRotate() } }, 'stop').name('停止旋转')
    actionsFolder.add({ toggle: function() {
      if (isRotating) {
        stopRotate()
      } else {
        startRotate()
      }
    } }, 'toggle').name('切换旋转')

    settingsFolder.open()

    return gui
  }

  function map_onClockTick() {
    if (!rotateOptions.enabled) return

    const spinRate = rotateOptions.speed
    const currentTime = map.clock.currentTime.secondsOfDay

    if (previousTime === null) {
      previousTime = currentTime
      return
    }

    let delta = (currentTime - previousTime) / 1000
    if (delta < 0) delta += 86400
    previousTime = currentTime

    const direction = rotateOptions.direction === 'cw' ? -1 : 1
    map.scene.camera.rotate(Cesium.Cartesian3.UNIT_Z, direction * spinRate * delta)
  }

  function startRotate() {
    if (!map) return
    if (isRotating) return

    previousTime = null
    map.on(mars3d.EventType.clockTick, map_onClockTick)
    isRotating = true
    logger.log('地球开始旋转')
  }

  function stopRotate() {
    if (!map) return
    map.off(mars3d.EventType.clockTick, map_onClockTick)
    isRotating = false
    logger.log('地球停止旋转')
  }

  function initMap() {
    map = new mars3d.Map('map3dContainer', {
      scene: {
        center: { lat: 34.265, lng: 108.954, alt: 20000000, heading: 0, pitch: -90 },
        clock: {
          multiplier: 200
        }
      },
      control: {
        baseLayerPicker: true,
        homeButton: true,
        sceneModePicker: true,
        navigationHelpButton: true,
        fullscreenButton: true,
        contextmenu: { hasDefault: true },
      },
      terrain: {
        url: 'https://data.mars3d.cn/terrain',
        show: true,
      },
      basemaps: [
        {
          name: '天地图影像',
          icon: 'https://data.mars3d.cn/img/thumbnail/basemap/tdt_img.png',
          type: 'tdt',
          layer: 'img_d',
          show: true,
        },
      ],
    })

    logger = createLogger()
    gui = createGUI()

    logger.log('mars3d 地图初始化完成')

    if (rotateOptions.autoStart) {
      setTimeout(startRotate, 1000)
    }

    return map
  }

  initMap()
</script>
<style>
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: linear-gradient(270deg, #667eea 0%, #764ba2 100%);
    color: #333;
  }

  #map3dContainer {
    width: 100%;
    height: 100%;
  }
</style>

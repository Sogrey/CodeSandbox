<engine-type>leaflet</engine-type>
<title>Leaflet 地图缩放</title>
<meta name="description" content="Leaflet 地图缩放控件示例，包括多种缩放方式：按钮缩放、滚轮缩放、双击缩放、键盘缩放。" />
<template>
<div id="map"></div>

<div class="control-panel" id="controlPanel">
  <div class="panel-title">🕹️ 缩放控制</div>
  <button id="zoomIn" class="ctrl-btn">➕ 放大</button>
  <button id="zoomOut" class="ctrl-btn">➖ 缩小</button>
  <div class="zoom-row">
    <label>缩放到:</label>
    <input type="number" id="targetZoom" min="1" max="18" value="12" class="zoom-input">
    <button id="zoomTo" class="ctrl-btn-small">跳转</button>
  </div>
  <div class="info-row">当前级别: <span id="zoomLevel">12</span></div>
</div>

<div class="info-panel">
  <div>🔍 当前级别: <span id="zoomLevelBig">12</span></div>
  <div>📍 中心: <span id="centerPos">30.53, 114.30</span></div>
  <div>📐 边界: <span id="bounds">-</span></div>
</div>
</template>
<script>
  L.tileLayer.amap = function(option) {
    option = option || {};
    var layer;
    var subdomains = "1234";
    switch (option.layer) {
      case "vec":
      default:
        layer = L.tileLayer(
          "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
            name: option.name || "矢量图",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
    }
    return layer;
  };

  var vec = L.tileLayer.amap({ layer: "vec", name: "矢量图" });

  var map = L.map("map", {
    center: [30.53, 114.3],
    zoom: 12,
    layers: [vec],
    zoomControl: false,
    doubleClickZoom: true,
    scrollWheelZoom: true
  });

  function updateInfo() {
    var zoom = map.getZoom();
    document.getElementById('zoomLevel').innerText = zoom;
    document.getElementById('zoomLevelBig').innerText = zoom;
    document.getElementById('targetZoom').value = zoom;
    var center = map.getCenter();
    document.getElementById('centerPos').innerText = center.lat.toFixed(4) + ', ' + center.lng.toFixed(4);
    var bounds = map.getBounds();
    document.getElementById('bounds').innerText = 
      bounds.getSouthWest().lat.toFixed(2) + ',' + bounds.getSouthWest().lng.toFixed(2) + 
      ' ~ ' + 
      bounds.getNorthEast().lat.toFixed(2) + ',' + bounds.getNorthEast().lng.toFixed(2);
  }

  map.on('zoomend', updateInfo);
  map.on('moveend', updateInfo);

  L.control.zoom({
    position: 'bottomright'
  }).addTo(map);

  document.getElementById('zoomIn').addEventListener('click', function() {
    map.zoomIn();
  });

  document.getElementById('zoomOut').addEventListener('click', function() {
    map.zoomOut();
  });

  document.getElementById('zoomTo').addEventListener('click', function() {
    var target = parseInt(document.getElementById('targetZoom').value);
    if (!isNaN(target) && target >= 1 && target <= 18) {
      map.setZoom(target);
    }
  });

  map.on('keypress', function(e) {
    if (e.originalEvent.key === '+' || e.originalEvent.key === '=') {
      map.zoomIn();
    } else if (e.originalEvent.key === '-') {
      map.zoomOut();
    }
  });

  map.getContainer().setAttribute('tabindex', '0');
  map.getContainer().focus();

  updateInfo();
</script>

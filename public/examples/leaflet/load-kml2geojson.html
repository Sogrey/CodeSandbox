<engine-type>leaflet</engine-type>
<title>Leaflet加载KML数据</title>
<meta name="description" content="KML（Keyhole Markup Language）作为一种常见的地理数据格式，被广泛应用于边界线、行政区划等矢量数据的存储。本例使用Leaflet加载KML边界线数据，并通过toGeoJSON转换为GeoJSON格式进行渲染，实现高效的交互体验。" />
<template>
<div id="map"></div>

<div class="info-panel" id="infoPanel">🔄 正在加载边界线数据...</div>
</template>
<script>
 // ========== 1. 初始化地图 ==========
 const map = L.map('map').setView([35.0000, 105.0000], 5);

 // 高德矢量底图
 L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
   subdomains: ['1', '2', '3', '4'],
   attribution: '&copy; 高德地图'
 }).addTo(map);

 // 比例尺
 L.control.scale({
   metric: true,
   imperial: false,
   position: 'bottomleft'
 }).addTo(map);
 map.zoomControl.setPosition('bottomright');

 // ========== 2. 线要素样式配置（鲜艳、醒目） ==========
 // 边界线样式：亮橙色、粗线、半透明边缘光晕感
 const lineStyle = {
   color: '#ff6600', // 亮橙色
   weight: 3, // 线宽 3px
   opacity: 0.85, // 不透明度
   smoothFactor: 1 // 平滑度
 };

 // 鼠标悬浮高亮样式
 const highlightStyle = {
   color: '#ffaa00', // 亮黄色
   weight: 5, // 加粗到 5px
   opacity: 1
 };

 // ========== 3. 加载并解析 KML ==========
 const infoDiv = document.getElementById('infoPanel');
 const kmlUrl = '../../../CodeSandbox/datas/province.kml';

 infoDiv.innerHTML = `⏳ 正在加载边界线...<br>🔗 ${kmlUrl}`;

 fetch(kmlUrl)
   .then(res => {
     if (!res.ok) throw new Error(`HTTP ${res.status}`);
     return res.text();
   })
   .then(kmlText => {
     const parser = new DOMParser();
     const kml = parser.parseFromString(kmlText, 'text/xml');
     if (kml.querySelector('parsererror')) throw new Error('KML 解析失败');

     // 转换为 GeoJSON
     const geojson = toGeoJSON.kml(kml);
     if (!geojson.features.length) throw new Error('没有找到有效数据');

     // 统计线要素数量
     let lineCount = 0;
     let pointCount = 0;
     geojson.features.forEach(f => {
       if (f.geometry.type === 'LineString') lineCount++;
       else if (f.geometry.type === 'Point') pointCount++;
     });

     // 提取名称的辅助函数（支持多种可能的字段名）
     function getFeatureName(properties) {
       if (!properties) return null;
       return properties.name ||
         properties.Name ||
         properties.title ||
         properties.Title ||
         properties.NAME ||
         properties.NAMES ||
         properties.省 || // 中文字段
         properties.市 ||
         properties.县 ||
         properties.NAME_1 ||
         properties.NAME_2 ||
         null;
     }

     // 创建 GeoJSON 图层
     const geoJsonLayer = L.geoJSON(geojson, {
       // 线要素样式
       style: function(feature) {
         // 判断是否是线要素
         if (feature.geometry.type === 'LineString') {
           return lineStyle;
         }
         // 点要素使用单独样式
         return {
           color: '#ffaa00',
           weight: 2
         };
       },
       onEachFeature: function(feature, layer) {
         // 只对线要素添加交互
         if (feature.geometry.type === 'LineString') {
           // 获取名称
           let name = getFeatureName(feature.properties);

           // 绑定弹窗
           if (name && name !== '未命名') {
             layer.bindPopup(`
                                        <div style="min-width:120px; text-align:center;">
                                            <strong>📍 ${name}</strong><br>
                                            <span style="font-size:11px; color:#666;">边界线</span>
                                        </div>
                                    `);
           } else {
             // 没有名称时显示默认信息
             layer.bindPopup(`
                                        <div style="min-width:100px; text-align:center;">
                                            📍 边界线要素
                                        </div>
                                    `);
           }

           // 鼠标悬浮高亮
           layer.on('mouseover', function(e) {
             layer.setStyle(highlightStyle);
             // 可选：悬浮时自动打开弹窗
             // layer.openPopup();
           });

           layer.on('mouseout', function(e) {
             layer.setStyle(lineStyle);
           });

           // 点击时打开弹窗
           layer.on('click', function(e) {
             layer.openPopup();
           });
         }
       }
     }).addTo(map);

     // 自动缩放至数据范围
     const bounds = geoJsonLayer.getBounds();
     if (bounds.isValid()) {
       map.fitBounds(bounds, {
         padding: [20, 20]
       });
     }

     // 成功提示（不显示图例面板）
     infoDiv.innerHTML = `✅ 边界线加载成功！<br>📊 线要素: ${lineCount} 条 | 点击查看名称`;
     infoDiv.classList.add('success-panel');

     console.log(`KML 加载成功 - 线要素: ${lineCount} 条`);
   })
   .catch(error => {
     console.error('加载失败:', error);
     infoDiv.innerHTML = `❌ 加载失败: ${error.message}<br>📌 请检查网络或文件地址`;
     infoDiv.classList.add('error-panel');
   });

 // 瓦片错误提示
 map.on('tileerror', function(e) {
   console.warn('底图瓦片加载异常:', e);
 });

 console.log('地图初始化完成，等待 KML 边界线加载');
</script>

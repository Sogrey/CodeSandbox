<engine-type>leaflet</engine-type>
<title>Leaflet 事件示例</title>
<meta name="description" content="Leaflet 地图事件示例，涵盖图层操作事件、地图状态事件、鼠标键盘响应事件、Popup事件，基于高德地图底图。" />
<template>
<div id="map"></div>

<div class="control-panel" id="layerPanel">
  <div class="panel-title">🗺️ 图层切换</div>
  <button data-layer="vec" class="ctrl-btn active">矢量图</button>
  <button data-layer="img" class="ctrl-btn">影像图</button>
  <button data-layer="time" class="ctrl-btn">实时路况</button>
</div>

<div class="event-log" id="eventLog">
  <div class="log-title">📋 事件日志</div>
  <div id="logContent"></div>
</div>

<div class="info-panel" id="infoPanel">
  <div>🖱️ <span id="mousePos">点击地图获取坐标</span></div>
  <div>🔍 缩放级别: <span id="zoomLevel">12</span></div>
  <div>📍 中心点: <span id="centerPos">30.53, 114.30</span></div>
  <div>🗂️ 当前图层: <span id="currentLayer">矢量图</span></div>
  <div>⌨️ 键盘: <span id="keyPress">点击地图后按任意键</span></div>
</div>
</template>
<script>
L.tileLayer.amap = function(option) {
    option = option || {};
    var layer;
    var subdomains = "1234";
    switch (option.layer) {
      case "vec":
      default:
        layer = L.tileLayer(
          "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
            name: option.name || "矢量图",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
      case "img_d":
        layer = L.tileLayer(
          "https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}", {
            name: option.name || "影像图",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
      case "img_z":
        layer = L.tileLayer(
          "https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}", {
            name: option.name || "影像注记",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
      case "img":
        layer = L.layerGroup([
          L.tileLayer.amap({ name: "影像底图", layer: "img_d" }),
          L.tileLayer.amap({ name: "影像注记", layer: "img_z" })
        ]);
        break;
      case "time":
        var time = new Date().getTime();
        layer = L.tileLayer(
          "https://tm.amap.com/trafficengine/mapabc/traffictile?v=1.0&t=1&x={x}&y={y}&z={z}&t=" + time, {
            name: option.name || "实时路况",
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
    }
    return layer;
  };

  var vec = L.tileLayer.amap({ layer: "vec", name: "矢量图" });
  var img = L.tileLayer.amap({ layer: "img", name: "影像图" });
  var time = L.tileLayer.amap({ layer: "time", name: "实时路况" });

  var baseLayers = {
    "矢量图": vec,
    "影像图": img,
    "实时路况": time
  };

  var map = L.map("map", {
    center: [30.53, 114.3],
    zoom: 12,
    layers: [vec],
    zoomControl: false
  });

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  var logContent = document.getElementById('logContent');
  var logCount = 0;
  var maxLogs = 50;

  function addLog(type, message) {
    logCount++;
    var time = new Date().toLocaleTimeString();
    var logEntry = document.createElement('div');
    logEntry.className = 'log-entry log-' + type.toLowerCase().replace(/\s+/g, '-');
    logEntry.innerHTML = '<span class="log-time">' + time + '</span><span class="log-type">[' + type + ']</span> ' + message;
    logContent.insertBefore(logEntry, logContent.firstChild);
    if (logCount > maxLogs) {
      logContent.removeChild(logContent.lastChild);
    }
  }

  function updateInfo() {
    document.getElementById('zoomLevel').innerText = map.getZoom();
    var center = map.getCenter();
    document.getElementById('centerPos').innerText = center.lat.toFixed(4) + ', ' + center.lng.toFixed(4);
  }

  map.on('baselayerchange', function(e) {
    addLog('图层操作', '基图层切换为: ' + e.name);
    document.getElementById('currentLayer').innerText = e.name;
  });

  map.on('moveend', function(e) {
    addLog('地图状态', '地图移动结束');
    updateInfo();
  });

  map.on('zoomend', function(e) {
    addLog('地图状态', '缩放级别改变为: ' + map.getZoom());
    updateInfo();
  });

  map.on('movestart', function(e) {
    addLog('地图状态', '开始移动地图');
  });

  map.on('zoomstart', function(e) {
    addLog('地图状态', '开始缩放');
  });

  map.on('click', function(e) {
    var coord = e.latlng.lat.toFixed(6) + ', ' + e.latlng.lng.toFixed(6);
    addLog('鼠标事件', '点击地图: ' + coord);
    document.getElementById('mousePos').innerText = coord;
    map.getContainer().focus();
  });

  map.on('dblclick', function(e) {
    addLog('鼠标事件', '双击地图');
  });

  map.on('contextmenu', function(e) {
    addLog('鼠标事件', '右键点击地图');
  });

  map.on('mouseover', function(e) {
    addLog('鼠标事件', '鼠标进入地图');
  });

  map.on('mouseout', function(e) {
    addLog('鼠标事件', '鼠标移出地图');
  });

  map.on('keypress', function(e) {
    var key = e.originalEvent.key;
    addLog('键盘事件', '按下键盘: ' + key);
    document.getElementById('keyPress').innerText = key;
  });

  map.on('keydown', function(e) {
    if (e.originalEvent.key === 'ArrowUp') {
      addLog('键盘事件', '按下 ↑ 方向键');
    } else if (e.originalEvent.key === 'ArrowDown') {
      addLog('键盘事件', '按下 ↓ 方向键');
    } else if (e.originalEvent.key === 'ArrowLeft') {
      addLog('键盘事件', '按下 ← 方向键');
    } else if (e.originalEvent.key === 'ArrowRight') {
      addLog('键盘事件', '按下 → 方向键');
    }
  });

  var marker = L.marker([30.53, 114.3]).addTo(map);
  marker.bindPopup('<b>武汉黄鹤楼</b><br>点击测试Popup事件');

  marker.on('popupopen', function(e) {
    addLog('Popup事件', '弹窗已打开');
  });

  marker.on('popupclose', function(e) {
    addLog('Popup事件', '弹窗已关闭');
  });

  var circle = L.circle([30.54, 114.32], {
    color: 'red',
    fillColor: '#f03',
    fillOpacity: 0.5,
    radius: 500
  }).addTo(map);
  circle.bindPopup('红色圆形区域');

  circle.on('popupopen', function(e) {
    addLog('Popup事件', '圆形弹窗已打开');
  });

  circle.on('popupclose', function(e) {
    addLog('Popup事件', '圆形弹窗已关闭');
  });

  map.on('layeradd', function(e) {
    if (e.layer instanceof L.TileLayer || e.layer instanceof L.LayerGroup) {
      addLog('图层操作', '添加图层');
    }
  });

  map.on('layerremove', function(e) {
    if (e.layer instanceof L.TileLayer || e.layer instanceof L.LayerGroup) {
      addLog('图层操作', '移除图层');
    }
  });

  var btnMap = {
    'vec': { layer: vec, name: '矢量图' },
    'img': { layer: img, name: '影像图' },
    'time': { layer: time, name: '实时路况' }
  };

  document.querySelectorAll('.ctrl-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var layerType = this.dataset.layer;
      if (btnMap[layerType]) {
        document.querySelectorAll('.ctrl-btn').forEach(function(b) {
          b.classList.remove('active');
        });
        this.classList.add('active');
        map.removeLayer(vec);
        map.removeLayer(img);
        map.removeLayer(time);
        map.addLayer(btnMap[layerType].layer);
        document.getElementById('currentLayer').innerText = btnMap[layerType].name;
        addLog('图层操作', '切换到底图: ' + btnMap[layerType].name);
      }
    });
  });

  updateInfo();
  addLog('系统', '地图初始化完成');
</script>

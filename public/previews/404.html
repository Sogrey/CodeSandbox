<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSandbox - 数据加载失败</title>
    <meta name="description" content="CodeSandbox预览页面数据加载失败，请检查分享链接是否正确">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .error-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        .error-title {
            font-size: 24px;
            font-weight: 700;
            color: #e74c3c;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(231, 76, 60, 0.1);
        }

        .error-description {
            font-size: 16px;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .error-details {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
            font-family: 'Courier New', monospace;
        }

        .error-details h4 {
            color: #444;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .error-details ul {
            list-style: none;
            font-size: 13px;
            line-height: 1.8;
        }

        .error-details li {
            margin: 8px 0;
            position: relative;
            padding-left: 20px;
        }

        .error-details li:before {
            content: "•";
            color: #667eea;
            font-weight: bold;
            position: absolute;
            left: 0;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 117, 125, 0.4);
        }

        .error-code {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }

        .timestamp {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-icon">🔍</div>
        <h1 class="error-title">数据加载失败</h1>
        <p class="error-description">
            很抱歉，无法加载您请求的预览数据。这可能是由于分享链接已过期、数据已被使用，或者链接格式不正确。
        </p>

        <div class="error-details">
            <h4>可能的原因：</h4>
            <ul>
                <li>分享链接中的token已过期或已被使用</li>
                <li>URL参数格式不正确或已损坏</li>
                <li>数据在传输过程中被修改</li>
                <li>浏览器不支持必要的Web API</li>
                <li>IndexedDB访问被拒绝</li>
            </ul>
        </div>

        <div class="action-buttons">
            <a href="https://sogrey.top/CodeSandbox" class="btn btn-primary" target="_blank">
                <span>🚀</span>
                <span>前往 CodeSandbox</span>
            </a>
            <button onclick="window.history.back()" class="btn btn-secondary">
                <span>⬅️</span>
                <span>返回上页</span>
            </button>
        </div>

        <div class="timestamp" id="timestamp">
            错误时间：<span id="errorTime"></span>
        </div>
    </div>

    <script>
        // 显示当前时间
        document.getElementById('errorTime').textContent = new Date().toLocaleString('zh-CN');

        // 尝试获取更多错误信息
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const content = urlParams.get('content');

            if (token) {
                console.error('Token参数:', token);
                // 可以在这里添加更多的错误诊断信息
            }
            
            if (content) {
                console.error('Content参数长度:', content.length);
                // 可以在这里添加更多的错误诊断信息
            }
        } catch (error) {
            console.error('获取URL参数失败:', error);
        }

        // 页面加载完成后的额外检查
        window.addEventListener('load', () => {
            console.log('404页面加载完成');
            console.log('User Agent:', navigator.userAgent);
            console.log('URL:', window.location.href);
        });
    </script>
</body>
</html>

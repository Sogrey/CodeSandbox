<engine-type>leaflet</engine-type>
<title>Leaflet 网格</title>
<meta name="description" content="Leaflet 网格线示例，使用 L.Graticule 插件在地图上显示经纬度网格线。" />
<template>
<div id="map"></div>

<div class="control-panel">
  <div class="panel-title">🔲 网格设置</div>
  <div class="option-item">
    <label><input type="checkbox" id="showGraticule" checked> 显示网格</label>
  </div>
  <div class="option-item">
    <label>网格间距:</label>
    <select id="graticuleInterval" class="position-select">
      <option value="1">1° (密集)</option>
      <option value="5">5°</option>
      <option value="10" selected>10°</option>
      <option value="20">20°</option>
      <option value="30">30°</option>
    </select>
  </div>
  <div class="color-picker">
    <label>网格颜色:</label>
    <input type="color" id="graticuleColor" value="#333333">
  </div>
  <div class="option-item">
    <label>网格线宽:</label>
    <input type="range" id="graticuleWeight" min="0.5" max="3" step="0.5" value="1" class="weight-slider">
    <span id="weightValue">1</span>px
  </div>
</div>

<div class="info-panel">
  <div>🔲 经纬度网格线</div>
  <div>赤道: 0° | 本初子午线: 0°</div>
</div>
</template>
<script>
  L.Graticule = L.GeoJSON.extend({
    options: {
      style: {
        color: '#333',
        weight: 1
      },
      interval: 20
    },
    initialize: function(options) {
      L.Util.setOptions(this, options);
      this._layers = {};
      this.addData(this._getGraticule());
    },
    _getGraticule: function() {
      var features = [], interval = this.options.interval;
      for (var lng = -180; lng <= 180; lng = lng + interval) {
        features.push(this._getFeature(this._getMeridian(lng), {
          "name": lng + "°"
        }));
      }
      for (var lat = -90; lat <= 90; lat = lat + interval) {
        features.push(this._getFeature(this._getParallel(lat), {
          "name": lat + "°"
        }));
      }
      return { "type": "FeatureCollection", "features": features };
    },
    _getMeridian: function(lng) {
      lng = this._lngFix(lng);
      var coords = [];
      for (var lat = -90; lat <= 90; lat++) {
        coords.push([lng, lat]);
      }
      return coords;
    },
    _getParallel: function(lat) {
      var coords = [];
      for (var lng = -180; lng <= 180; lng++) {
        coords.push([this._lngFix(lng), lat]);
      }
      return coords;
    },
    _getFeature: function(coords, prop) {
      return {
        "type": "Feature",
        "geometry": { "type": "LineString", "coordinates": coords },
        "properties": prop
      };
    },
    _lngFix: function(lng) {
      if (lng >= 180) return 179.999999;
      if (lng <= -180) return -179.999999;
      return lng;
    }
  });

  L.graticule = function(options) {
    return new L.Graticule(options);
  };

  L.tileLayer.amap = function(option) {
    option = option || {};
    var layer;
    var subdomains = "1234";
    switch (option.layer) {
      case "vec":
      default:
        layer = L.tileLayer(
          "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
            name: option.name || "矢量图",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
    }
    return layer;
  };

  var vec = L.tileLayer.amap({ layer: "vec", name: "矢量图" });

  var map = L.map("map", {
    center: [30, 114],
    zoom: 4,
    layers: [vec],
    zoomControl: false
  });

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  var graticule = L.graticule({
    interval: 10,
    style: {
      color: '#333',
      weight: 1,
      opacity: 0.6,
      dashArray: '3, 3'
    }
  }).addTo(map);

  graticule.eachLayer(function(layer) {
    var name = layer.feature && layer.feature.properties && layer.feature.properties.name;
    if (name) {
      layer.bindTooltip(L.tooltip({
        permanent: true,
        direction: 'center',
        className: 'graticule-label'
      }).setContent(name), { layer: layer });
    }
  });

  document.getElementById('showGraticule').addEventListener('change', function() {
    if (this.checked) {
      graticule.addTo(map);
    } else {
      graticule.remove();
    }
  });

  document.getElementById('graticuleInterval').addEventListener('change', function() {
    var interval = parseInt(this.value);
    graticule.remove();
    graticule = L.graticule({
      interval: interval,
      style: {
        color: document.getElementById('graticuleColor').value,
        weight: parseFloat(document.getElementById('graticuleWeight').value),
        opacity: 0.6,
        dashArray: '3, 3'
      }
    }).addTo(map);
  });

  document.getElementById('graticuleColor').addEventListener('input', function() {
    graticule.setStyle({
      color: this.value
    });
  });

  document.getElementById('graticuleWeight').addEventListener('input', function() {
    document.getElementById('weightValue').innerText = this.value;
    graticule.setStyle({
      weight: parseFloat(this.value)
    });
  });
</script>

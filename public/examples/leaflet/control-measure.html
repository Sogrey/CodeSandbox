<engine-type>leaflet</engine-type>
<title>Leaflet 测量</title>
<meta name="description" content="Leaflet 测量控件示例，使用 leaflet-measure 插件测量距离和面积。" />
<template>
<div id="map"></div>
</template>
<script>
  L.tileLayer.amap = function(option) {
    option = option || {};
    var layer;
    var subdomains = "1234";
    switch (option.layer) {
      case "vec":
      default:
        layer = L.tileLayer(
          "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
            name: option.name || "矢量图",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
    }
    return layer;
  };

  var vec = L.tileLayer.amap({ layer: "vec", name: "矢量图" });

  var map = L.map("map", {
    center: [30.53, 114.3],
    zoom: 13,
    layers: [vec],
    zoomControl: false
  });

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  var measureControl = L.measure().addTo(map);

  measureControl.on('measure:start', function(e) {
    console.log('测量开始', e.mode);
  });

  measureControl.on('measure:end', function(e) {
    console.log('测量结束', e);
  });

  measureControl.on('measure:cancel', function() {
    console.log('测量取消');
  });

  measureControl.on('measure:clear', function() {
    console.log('测量结果已清除');
  });
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
  #map { width: 100%; height: 100%; }

  .leaflet-control-zoom {

    top: auto !important; left: auto !important; border: none !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15) !important;
  }
  .leaflet-control-zoom a {

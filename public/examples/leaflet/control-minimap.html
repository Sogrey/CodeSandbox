<engine-type>leaflet</engine-type>
<title>Leaflet 鹰眼图</title>
<meta name="description" content="Leaflet 鹰眼图（小地图）示例，使用 Leaflet-MiniMap 插件在角落显示小地图。" />
<template>
<div id="map"></div>

<div class="control-panel">
  <div class="panel-title">🗺️ 鹰眼图设置</div>
  <div class="option-item">
    <label><input type="checkbox" id="showMiniMap" checked> 显示鹰眼图</label>
  </div>
  <div class="option-item">
    <label>鹰眼位置:</label>
    <select id="miniMapPosition" class="position-select">
      <option value="topright">右上</option>
      <option value="topleft">左上</option>
      <option value="bottomright" selected>右下</option>
      <option value="bottomleft">左下</option>
    </select>
  </div>
  <div class="option-item">
    <label>叠加图层:</label>
    <select id="miniMapLayer" class="position-select">
      <option value="vec">矢量图</option>
      <option value="img_d">影像图</option>
      <option value="img">影像+注记</option>
    </select>
  </div>
</div>

<div class="info-panel">
  <div>🗺️ 鹰眼图显示主地图的 overview</div>
  <div>当前级别: <span id="zoomLevel">12</span></div>
</div>
</template>
<script>
  L.tileLayer.amap = function(option) {
    option = option || {};
    var layer;
    var subdomains = "1234";
    switch (option.layer) {
      case "vec":
        layer = L.tileLayer(
          "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
            name: option.name || "矢量图",
            subdomains: subdomains,
            attribution: ''
          }
        );
        break;
      case "img_d":
        layer = L.tileLayer(
          "https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}", {
            name: option.name || "影像图",
            subdomains: subdomains,
            attribution: ''
          }
        );
        break;
      case "img":
        layer = L.layerGroup([
          L.tileLayer.amap({ name: "影像底图", layer: "img_d" }),
          L.tileLayer.amap({ name: "影像注记", layer: "img_z" })
        ]);
        break;
      case "img_z":
        layer = L.tileLayer(
          "https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}", {
            name: option.name || "影像注记",
            subdomains: subdomains,
            attribution: ''
          }
        );
        break;
    }
    return layer;
  };

  var vec = L.tileLayer.amap({ layer: "vec", name: "矢量图" });
  var miniMapLayer = L.tileLayer.amap({ layer: "vec", name: "矢量图" });

  var map = L.map("map", {
    center: [30.53, 114.3],
    zoom: 12,
    layers: [vec],
    zoomControl: false
  });

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  var miniMap = L.control.minimap(miniMapLayer, {
    position: 'bottomright',
    toggleDisplay: true,
    aimingRectOptions: { color: '#006eff', weight: 2, fillOpacity: 0.1 },
    shadowRectOptions: { color: '#ff7800', weight: 2, fillOpacity: 0.05 }
  }).addTo(map);

  document.getElementById('showMiniMap').addEventListener('change', function() {
    if (this.checked) {
      miniMap.addTo(map);
    } else {
      miniMap.remove();
    }
  });

  document.getElementById('miniMapPosition').addEventListener('change', function() {
    miniMap.remove();
    miniMap.setPosition(this.value);
    miniMap.addTo(map);
  });

  document.getElementById('miniMapLayer').addEventListener('change', function() {
    var newLayer;
    switch(this.value) {
      case 'vec':
        newLayer = L.tileLayer.amap({ layer: "vec", name: "矢量图" });
        break;
      case 'img_d':
        newLayer = L.tileLayer.amap({ layer: "img_d", name: "影像图" });
        break;
      case 'img':
        newLayer = L.tileLayer.amap({ layer: "img", name: "影像+注记" });
        break;
    }
    miniMap.changeLayer(newLayer);
  });

  map.on('zoomend', function() {
    document.getElementById('zoomLevel').innerText = map.getZoom();
  });

  document.getElementById('zoomLevel').innerText = map.getZoom();
</script>

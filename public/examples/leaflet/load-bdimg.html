<engine-type>leaflet</engine-type>
<title>Leaflet加载百度地图</title>
<meta name="description" content="加载百度地图时，开发者常常遇到坐标系不兼容、瓦片无法显示等问题。" />
<template>
<div id="map"></div>

<div class="info-panel" id="infoPanel">
  🔄 正在加载百度地图...
</div>
<button class="coord-btn" id="copyBtn">📋 复制坐标</button>
<div class="status-bar" id="statusBar">⏳ 初始化中</div>
</template>
<script>
 // ========== 1. 定义百度地图的 CRS ==========
 L.CRS.Baidu = new L.Proj.CRS('EPSG:900913',
   '+proj=merc +a=6378206 +b=6356584.314245179 +lat_ts=0.0 +lon_0=0.0 +x_0=0 +y_0=0 +k=1.0 +units=m +nadgrids=@null +wktext +no_defs', {
     resolutions: (function() {
       let level = 19;
       let res = [];
       res[0] = Math.pow(2, 18);
       for (let i = 1; i < level; i++) {
         res[i] = Math.pow(2, (18 - i));
       }
       return res;
     })(),
     origin: [0, 0],
     bounds: L.bounds([20037508.342789244, 0], [0, 20037508.342789244])
   });

 // ========== 2. 百度地图瓦片加载函数 ==========
 L.tileLayer.baidu = function(options) {
   options = options || {};
   let layer;
   switch (options.layer) {
     case "custom":
       options.customid = options.customid || 'midnight';
       layer = L.tileLayer(
         `https://api.map.baidu.com/customimage/tile?&x={x}&y={y}&z={z}&scale=1&customid=${options.customid}`, {
           subdomains: "012",
           tms: true,
           attribution: '&copy; 百度地图'
         }
       );
       break;
     default:
       layer = L.tileLayer(
         'https://online{s}.map.bdimg.com/onlinelabel/?qt=tile&x={x}&y={y}&z={z}&styles=pl&scaler=1&p=1', {
           subdomains: "0123456789",
           tms: true,
           attribution: '&copy; 百度地图'
         }
       );
   }
   return layer;
 };

 // ========== 3. WGS84 转 GCJ02 转 BD09 坐标转换 ==========
 const coordTransform = (function() {
   const pi = 3.1415926535897932384626;
   const a = 6378245.0;
   const ee = 0.00669342162296594323;

   function out_of_china(lng, lat) {
     return (lng < 72.004 || lng > 137.8347) || ((lat < 0.8293 || lat > 55.8271) || false);
   }

   function transformlat(lng, lat) {
     let ret = -100.0 + 2.0 * lng + 3.0 * lat + 0.2 * lat * lat + 0.1 * lng * lat + 0.2 * Math.sqrt(Math.abs(lng));
     ret += (20.0 * Math.sin(6.0 * lng * pi) + 20.0 * Math.sin(2.0 * lng * pi)) * 2.0 / 3.0;
     ret += (20.0 * Math.sin(lat * pi) + 40.0 * Math.sin(lat / 3.0 * pi)) * 2.0 / 3.0;
     ret += (160.0 * Math.sin(lat / 12.0 * pi) + 320 * Math.sin(lat * pi / 30.0)) * 2.0 / 3.0;
     return ret;
   }

   function transformlng(lng, lat) {
     let ret = 300.0 + lng + 2.0 * lat + 0.1 * lng * lng + 0.1 * lng * lat + 0.1 * Math.sqrt(Math.abs(lng));
     ret += (20.0 * Math.sin(6.0 * lng * pi) + 20.0 * Math.sin(2.0 * lng * pi)) * 2.0 / 3.0;
     ret += (20.0 * Math.sin(lng * pi) + 40.0 * Math.sin(lng / 3.0 * pi)) * 2.0 / 3.0;
     ret += (150.0 * Math.sin(lng / 12.0 * pi) + 300.0 * Math.sin(lng / 30.0 * pi)) * 2.0 / 3.0;
     return ret;
   }

   // WGS84 转 GCJ02
   function wgs84togcj02(lng, lat) {
     if (out_of_china(lng, lat)) return [lng, lat];
     let dlat = transformlat(lng - 105.0, lat - 35.0);
     let dlng = transformlng(lng - 105.0, lat - 35.0);
     let radlat = lat / 180.0 * pi;
     let magic = Math.sin(radlat);
     magic = 1 - ee * magic * magic;
     let sqrtmagic = Math.sqrt(magic);
     dlat = (dlat * 180.0) / ((a * (1 - ee)) / (magic * sqrtmagic) * pi);
     dlng = (dlng * 180.0) / (a / sqrtmagic * Math.cos(radlat) * pi);
     return [lng + dlng, lat + dlat];
   }

   // GCJ02 转 BD09
   function gcj02tobd09(lng, lat) {
     const z = Math.sqrt(lng * lng + lat * lat) + 0.00002 * Math.sin(lat * pi * 3000.0 / 180.0);
     const theta = Math.atan2(lat, lng) + 0.000003 * Math.cos(lng * pi * 3000.0 / 180.0);
     const bd_lng = z * Math.cos(theta) + 0.0065;
     const bd_lat = z * Math.sin(theta) + 0.006;
     return [bd_lng, bd_lat];
   }

   // WGS84 直接转 BD09
   function wgs84tobd09(lng, lat) {
     const gcj02 = wgs84togcj02(lng, lat);
     return gcj02tobd09(gcj02[0], gcj02[1]);
   }

   return {
     wgs84tobd09
   };
 })();

 // ========== 4. 初始化地图 - 西安钟楼 ==========
 // 西安钟楼的WGS84坐标 (来自GPS/国际标准)
 const zhonglouLng = 108.940175;
 const zhonglouLat = 34.261457;

 // 转换为百度BD09坐标
 const bd09 = coordTransform.wgs84tobd09(zhonglouLng, zhonglouLat);
 const bd09Lng = bd09[0];
 const bd09Lat = bd09[1];

 // Leaflet需要的格式 [纬度, 经度]
 const mapCenter = [bd09Lat, bd09Lng];

 const map = L.map('map', {
   crs: L.CRS.Baidu,
   center: mapCenter,
   zoom: 16,
   minZoom: 3,
   maxZoom: 18,
   zoomControl: false,
   attributionControl: false
 });

 // 添加缩放控件到右下角
 L.control.zoom({
   position: 'bottomright'
 }).addTo(map);

 // 添加百度地图瓦片（标准样式）
 const baiduLayer = L.tileLayer.baidu({
   layer: 'standard'
 }).addTo(map);

 // ========== 5. 添加地图元素 - 西安钟楼 ==========
 // 添加主标记点
 const marker = L.marker(mapCenter).addTo(map);
 marker.bindPopup(`
                <b>🏛️ 西安钟楼</b><br>
                <i>中国现存规模最大、保存最完整的钟楼</i><br>
                <hr style="margin: 5px 0;">
                📍 WGS84坐标: ${zhonglouLng}, ${zhonglouLat}<br>
                📍 BD09坐标: ${bd09Lng.toFixed(6)}, ${bd09Lat.toFixed(6)}<br>
                🏙️ 地址: 西安市碑林区东西南北四条大街交汇处
            `).openPopup();

 // 添加圆形区域（钟楼辐射范围）
 L.circle(mapCenter, {
   color: '#d4af37',
   weight: 3,
   fillColor: '#d4af37',
   fillOpacity: 0.15,
   radius: 150
 }).addTo(map);

 // 添加一个额外的标记点作为装饰（钟楼周边）
 L.marker([bd09Lat + 0.0008, bd09Lng]).addTo(map)
   .bindPopup('📍 钟楼饭店<br>西安地标性酒店');

 L.marker([bd09Lat - 0.0005, bd09Lng + 0.0006]).addTo(map)
   .bindPopup('🛍️ 开元商城<br>钟楼旁商业中心');

 // 添加比例尺
 L.control.scale({
   metric: true,
   imperial: false,
   position: 'bottomleft'
 }).addTo(map);

 // ========== 6. 交互功能 ==========
 const infoPanel = document.getElementById('infoPanel');
 const copyBtn = document.getElementById('copyBtn');
 const statusBar = document.getElementById('statusBar');
 let currentCoord = {
   lat: bd09Lat,
   lng: bd09Lng
 };

 function updateInfo(lat, lng, zoom) {
   infoPanel.innerHTML = `
                    🏛️ 西安钟楼 | BD09坐标: ${lat.toFixed(6)} , ${lng.toFixed(6)}<br>
                    🔍 缩放级别: ${zoom}<br>
                    📐 地图服务: 百度地图 | 坐标系: BD09 MC
                `;
   currentCoord = {
     lat,
     lng
   };
 }

 // 监听地图移动事件
 map.on('moveend', () => {
   const center = map.getCenter();
   const zoom = map.getZoom();
   updateInfo(center.lat, center.lng, zoom);
   statusBar.innerHTML = `✓ 层级: ${zoom} | 中心: ${center.lat.toFixed(5)}, ${center.lng.toFixed(5)}`;
 });

 // 监听地图点击事件
 map.on('click', (e) => {
   const {
     lat,
     lng
   } = e.latlng;
   L.popup()
     .setLatLng([lat, lng])
     .setContent(`📌 点击位置 (BD09)<br>${lat.toFixed(6)}, ${lng.toFixed(6)}`)
     .openOn(map);
   statusBar.innerHTML = `🖱️ 点击: ${lat.toFixed(6)}, ${lng.toFixed(6)} | 层级: ${map.getZoom()}`;
 });

 // 瓦片加载成功
 baiduLayer.on('load', () => {
   console.log('百度地图瓦片加载成功 - 西安钟楼');
   statusBar.innerHTML = '✅ 地图加载成功 | 当前定位: 西安钟楼';
   setTimeout(() => {
     if (statusBar.innerHTML.includes('成功')) {
       statusBar.style.opacity = '0.7';
       setTimeout(() => {
         statusBar.style.opacity = '1';
       }, 100);
     }
   }, 3000);
 });

 // 瓦片加载错误
 baiduLayer.on('tileerror', (error) => {
   console.warn('瓦片加载失败:', error);
   statusBar.innerHTML = '⚠️ 瓦片加载异常，请检查网络';
   statusBar.style.color = '#ff6666';
 });

 // 复制坐标功能
 copyBtn.addEventListener('click', async () => {
   const text = `${currentCoord.lat.toFixed(6)}, ${currentCoord.lng.toFixed(6)}`;
   try {
     await navigator.clipboard.writeText(text);
     const original = copyBtn.innerText;
     copyBtn.innerText = '✅ 已复制!';
     setTimeout(() => {
       copyBtn.innerText = original;
     }, 1500);
     statusBar.innerHTML = `📋 已复制坐标: ${text}`;
   } catch (err) {
     alert('坐标: ' + text);
     console.error('复制失败:', err);
   }
 });

 // 初始化显示
 updateInfo(bd09Lat, bd09Lng, 16);
 statusBar.innerHTML = `✅ 西安钟楼 | BD09: ${bd09Lng.toFixed(5)}, ${bd09Lat.toFixed(5)}`;
 console.log('百度地图加载完成 - 西安钟楼');
 console.log(`西安钟楼 WGS84: [${zhonglouLng}, ${zhonglouLat}]`);
 console.log(`西安钟楼 BD09: [${bd09Lng}, ${bd09Lat}]`);
</script>

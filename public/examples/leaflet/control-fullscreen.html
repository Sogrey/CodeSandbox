<engine-type>leaflet</engine-type>
<title>Leaflet 全屏</title>
<meta name="description" content="Leaflet 全屏控件示例，使用 Leaflet.fullscreen 插件实现地图全屏显示。" />
<template>
<div id="map"></div>

<div class="control-panel" id="controlPanel">
  <div class="panel-title">🖥️ 全屏控制</div>
  <button id="fullscreenBtn" class="ctrl-btn">⛶ 进入全屏</button>
  <div class="info-text">提示：按 ESC 键退出全屏</div>
</div>

<div class="info-panel">
  <div>🖥️ 全屏模式示例</div>
  <div>状态: <span id="fullscreenStatus">普通模式</span></div>
</div>
</template>
<script>
  L.tileLayer.amap = function(option) {
    option = option || {};
    var layer;
    var subdomains = "1234";
    switch (option.layer) {
      case "vec":
      default:
        layer = L.tileLayer(
          "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
            name: option.name || "矢量图",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
    }
    return layer;
  };

  var vec = L.tileLayer.amap({ layer: "vec", name: "矢量图" });

  var map = L.map("map", {
    center: [30.53, 114.3],
    zoom: 12,
    layers: [vec],
    zoomControl: false,
    fullscreenControl: true
  });

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.control.fullscreen({
    position: 'topright',
    title: '进入全屏',
    titleCancel: '退出全屏',
    forceSeparate: true,
    pseudoFullscreen: false
  }).addTo(map);

  var isFullscreen = false;

  map.on('enterFullscreen', function() {
    isFullscreen = true;
    document.getElementById('fullscreenStatus').innerText = '全屏模式';
    document.getElementById('fullscreenBtn').innerText = '⛶ 退出全屏';
    document.getElementById('controlPanel').style.display = 'none';
  });

  map.on('exitFullscreen', function() {
    isFullscreen = false;
    document.getElementById('fullscreenStatus').innerText = '普通模式';
    document.getElementById('fullscreenBtn').innerText = '⛶ 进入全屏';
    document.getElementById('controlPanel').style.display = 'block';
  });

  document.getElementById('fullscreenBtn').addEventListener('click', function() {
    if (isFullscreen) {
      map.getFullscreenControl()._exitFullscreen();
    } else {
      map.getFullscreenControl()._enterFullscreen();
    }
  });
</script>

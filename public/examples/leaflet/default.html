<engine-type>leaflet</engine-type>
<title>Leaflet 示例</title>
<meta name="description" content="这是一个简单 Leaflet 示例" />
<template>
<div id="map"></div>
</template>
<script>
var map = L.map('map', {
  center: [39.9042, 116.4074],
  zoom: 10,
  zoomControl: true
});

var gaodeRoadLayer = L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?x={x}&y={y}&z={z}&lang=zh_cn&style=8&ltype=2&scl=0&size=1', {
  subdomains: ['1', '2', '3', '4'],
  minZoom: 3,
  maxZoom: 18,
  attribution: '© 高德地图'
});

gaodeRoadLayer.addTo(map);
</script>

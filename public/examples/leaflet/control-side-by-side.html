<engine-type>leaflet</engine-type>
<title>Leaflet 卷帘对比</title>
<meta name="description" content="Leaflet 卷帘对比示例，使用 leaflet-side-by-side 插件实现左右对比效果。" />
<template>
<div id="map"></div>

<div class="control-panel">
  <div class="panel-title">🪟 卷帘对比</div>
  <div class="layer-info">
    <div class="layer-item left">
      <span class="label">左侧:</span>
      <span class="name" id="leftLayerName">矢量地图</span>
    </div>
    <div class="layer-item right">
      <span class="label">右侧:</span>
      <span class="name" id="rightLayerName">卫星影像</span>
    </div>
  </div>
  <div class="hint">👈 拖动中间滑块进行对比 👉</div>
</div>
</template>
<script>
  L.tileLayer.amap = function(option) {
    option = option || {};
    var layer;
    var subdomains = "1234";
    switch (option.layer) {
      case "vec":
        layer = L.tileLayer(
          "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
            name: option.name || "矢量图",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
      case "satellite":
      case "img":
        layer = L.tileLayer(
          "https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}", {
            name: option.name || "卫星影像",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
      case "cia":
        layer = L.tileLayer(
          "https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}", {
            name: option.name || "卫星注记",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
    }
    return layer;
  };

  var map = L.map('map', {
    center: [30.5217, 114.3948],
    zoom: 12,
    minZoom: 1,
    maxZoom: 18,
    zoomControl: false
  });

  var vecLayer = L.tileLayer.amap({ layer: "vec", name: "矢量地图" });
  var imgLayer = L.tileLayer.amap({ layer: "satellite", name: "卫星影像" });

  vecLayer.addTo(map);
  imgLayer.addTo(map);

  L.control.sideBySide(vecLayer, imgLayer).addTo(map);

  L.control.zoom({ position: 'bottomright' }).addTo(map);
</script>

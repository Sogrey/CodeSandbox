<engine-type>leaflet</engine-type>
<title>Leaflet 比例尺</title>
<meta name="description" content="Leaflet 比例尺控件示例，Leaflet 内置比例尺控件，支持公制和英制单位。" />
<template>
<div id="map"></div>

<div class="control-panel">
  <div class="panel-title">📏 比例尺设置</div>
  <div class="unit-toggle">
    <button id="metricBtn" class="unit-btn active">公制 (m/km)</button>
    <button id="imperialBtn" class="unit-btn">英制 (ft/mi)</button>
  </div>
  <div class="option-item">
    <label><input type="checkbox" id="showScale" checked> 显示比例尺</label>
  </div>
  <div class="option-item">
    <label><input type="checkbox" id="showMaxWidth" checked> 显示最大宽度</label>
  </div>
</div>

<div class="info-panel">
  <div>📐 当前比例尺信息</div>
  <div>缩放级别: <span id="zoomLevel">12</span></div>
  <div>图上1cm = 实际 <span id="scaleRatio">--</span></div>
</div>
</template>
<script>
  L.tileLayer.amap = function(option) {
    option = option || {};
    var layer;
    var subdomains = "1234";
    switch (option.layer) {
      case "vec":
      default:
        layer = L.tileLayer(
          "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
            name: option.name || "矢量图",
            subdomains: subdomains,
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>'
          }
        );
        break;
    }
    return layer;
  };

  var vec = L.tileLayer.amap({ layer: "vec", name: "矢量图" });

  var map = L.map("map", {
    center: [30.53, 114.3],
    zoom: 12,
    layers: [vec],
    zoomControl: false
  });

  var metricScale = L.control.scale({
    position: 'bottomleft',
    metric: true,
    imperial: false,
    maxWidth: 200
  }).addTo(map);

  var imperialScale = L.control.scale({
    position: 'bottomleft',
    metric: false,
    imperial: true,
    maxWidth: 200
  });

  imperialScale.remove();

  function updateScaleInfo() {
    var zoom = map.getZoom();
    document.getElementById('zoomLevel').innerText = zoom;
    
    var metersPerPixel = 156543.03392 * Math.cos(map.getCenter().lat * Math.PI / 180) / Math.pow(2, zoom);
    var cmPerPixel = metersPerPixel * 100;
    var scale = Math.round(cmPerPixel * 200 / 100) * 100;
    document.getElementById('scaleRatio').innerText = (scale / 100) + ' m';
  }

  map.on('zoomend', updateScaleInfo);
  map.on('moveend', updateScaleInfo);

  document.getElementById('metricBtn').addEventListener('click', function() {
    imperialScale.remove();
    metricScale.addTo(map);
    document.getElementById('metricBtn').classList.add('active');
    document.getElementById('imperialBtn').classList.remove('active');
  });

  document.getElementById('imperialBtn').addEventListener('click', function() {
    metricScale.remove();
    imperialScale.addTo(map);
    document.getElementById('imperialBtn').classList.add('active');
    document.getElementById('metricBtn').classList.remove('active');
  });

  document.getElementById('showScale').addEventListener('change', function() {
    if (this.checked) {
      if (document.getElementById('metricBtn').classList.contains('active')) {
        metricScale.addTo(map);
      } else {
        imperialScale.addTo(map);
      }
    } else {
      metricScale.remove();
      imperialScale.remove();
    }
  });

  updateScaleInfo();
</script>
